name: Cross-platform Build Matrix

on:
  workflow_dispatch:
    inputs:
      build:
        description: Platform group to build
        required: true
        type: string
        default: all
      type:
        description: Output type
        required: true
        type: choice
        default: installer
        options:
          - installer
          - app

permissions:
  contents: read

concurrency:
  group: gitmanager-build-matrix-${{ github.ref }}-${{ inputs.build }}-${{ inputs.type }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    if: ${{ inputs.build == 'all' || inputs.build == matrix.platform || contains(matrix.aliases, inputs.build) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            selector: windows(10,x64)
            output: windows-x64
            aliases: ["windows(10,x64)", "windows(11,x64)"]
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            label: Windows 10/11 x64
          - platform: windows
            selector: windows(10,x86)
            output: windows-x86
            aliases: ["windows(10,x86)", "windows(11,x86)"]
            target: i686-pc-windows-msvc
            runner: windows-2025
            label: Windows x86 (32-bit)
          - platform: windows
            selector: windows(11,arm64)
            output: windows-arm64
            aliases: ["windows(10,arm64)", "windows(11,arm64)"]
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            label: Windows 11 ARM64
          - platform: linux
            selector: linux(x64)
            aliases: ["linux(x64)"]
            output: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            label: Linux x64
          - platform: linux
            selector: linux(arm64)
            aliases: ["linux(arm64)"]
            output: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            label: Linux ARM64
          - platform: macos
            selector: macos(x64)
            aliases: ["macos(x64)"]
            output: macos-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            label: macOS Intel x64
          - platform: macos
            selector: macos(arm64)
            aliases: ["macos(arm64)"]
            output: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            label: macOS Apple Silicon ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/.rcache
      CARGO_TERM_COLOR: always
      GITMANAGER_SKIP_CLOUD_NODE_BUNDLE: "1"
    steps:
      - name: Check out GitManager
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate build-script syntax and target selectors
        run: |
          python -m py_compile build.py tools/build_targets.py
          python tools/test_build_targets.py

      - name: Build selected target
        shell: bash
        run: python build.py --build='${{ matrix.selector }}' --type='${{ inputs.type }}'

      - name: Verify published output
        shell: bash
        run: |
          OUTPUT="build/dist/${{ matrix.output }}"
          test -d "$OUTPUT"
          test -s "$OUTPUT/build-manifest.json"
          cat "$OUTPUT/build-manifest.json"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-${{ matrix.output }}
          path: build/dist/${{ matrix.output }}/
          if-no-files-found: error
          retention-days: 21

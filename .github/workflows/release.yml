name: Build GitManager — Native Installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & libgit2 dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Dependencies & Build via Python Build Script
        run: python3 build.py build --install-tauri-cli

      - name: Name the Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS setup.exe." }
          Copy-Item $installer.FullName "src-tauri/target/release/bundle/nsis/GitManager-Setup.exe" -Force

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-installers-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          compression-level: 9

name: Build GitManager — Native Installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  cloud-node-deployment:
    name: RBE node bootstrap package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js for the Next.js Engine frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the lightweight RBE bootstrap ZIP (route files and configuration templates)
        run: python build.py prepare-cloud-node

      - name: Validate bootstrap installer and regression tests
        run: |
          python -m py_compile build.py tools/cloud-node-deployment/setup.py tools/cloud-node-deployment/test_setup.py
          python -m unittest discover -s tools/cloud-node-deployment -p 'test_*.py'

      - name: Verify the bootstrap payload and current runner's RBE download
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archives = sorted(pathlib.Path("build/dist/deployment").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one bootstrap ZIP, found {len(archives)}")
          with tempfile.TemporaryDirectory(prefix="gitmanager-rbe-bootstrap-") as temp:
              with zipfile.ZipFile(archives[0], "r") as package:
                  bad = package.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC verification failed at {bad}")
                  names = set(package.namelist())
                  required = {"setup.py", "manifest.json", "settings.json", "setting.node.cn.json", "api/health.route", "api/status.route"}
                  missing = required - names
                  if missing:
                      raise SystemExit(f"Bootstrap ZIP is missing: {sorted(missing)}")
                  binary_names = {
                      "backend", "backend.exe", "cloud_node", "cloud_node.exe",
                      "container", "container.exe", "service", "service.exe",
                  }
                  if any(name.startswith("binaries/") or name.rsplit("/", 1)[-1].lower() in binary_names for name in names):
                      raise SystemExit("Bootstrap ZIP unexpectedly contains platform binaries")
                  package.extractall(temp)
              setup = pathlib.Path(temp) / "setup.py"
              result = subprocess.run([sys.executable, str(setup), "--verify-only"], check=False)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY

      - name: Upload RBE node bootstrap ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-cloud-node-deployment
          path: build/dist/deployment/*.zip
          if-no-files-found: error
          compression-level: 0

  build-tauri:
    name: Build native-target installers (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            selector: windows(10,x64)
            output: windows-x64
          - platform: ubuntu-22.04
            selector: linux(x64)
            output: linux-x64
          - platform: macos-latest
            selector: macos(arm64)
            output: macos-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux WebKitGTK and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 rpm patchelf

      - name: Install Windows MPDEV and NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id MasterPackager.MasterPackagerDev --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
          $candidates = @(
            (Get-Command mpdev.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
            "$env:ProgramFiles\Master Packager Ltd\Master Packager Dev\mpdev.exe",
            "$env:ProgramFiles\Master Packager Dev\mpdev.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if (-not $candidates) {
            $found = Get-ChildItem -Path "$env:ProgramFiles" -Filter mpdev.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $candidates = @($found.FullName) }
          }
          if (-not $candidates) { throw "Required Master Packager Dev installation did not expose mpdev.exe." }
          "MPDEV_EXE=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$($candidates[0])" version
          if ($LASTEXITCODE -ne 0) { throw "Master Packager Dev version check failed." }

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Import optional Windows production signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
            Write-Host "::notice::No complete Windows signing credentials are configured. The release packages will use development/unsigned signing."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "gitmanager-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_SIGNING_PASSWORD -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $expected = ($env:WINDOWS_SIGNING_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if (-not ($imported | Where-Object { $_.Thumbprint -eq $expected })) {
              throw "The imported PFX does not contain WINDOWS_SIGNING_THUMBPRINT."
            }
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build on this native runner with the build script
        env:
          GITMANAGER_SKIP_CLOUD_NODE_BUNDLE: "1"
          GITMANAGER_DEFER_MPDEV_PACKAGING: "1"
        run: python build.py --build='${{ matrix.selector }}' --type=installer --install-tauri-cli

      - name: Sign Windows app payload and NSIS fallback before MPDEV packaging
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $profileDir = "build/.rcache/x86_64-pc-windows-msvc/release"
          $staging = "build/.rcache/windows-package/source"
          $installer = Join-Path $profileDir "bundle/nsis/GitManager-Setup.exe"
          $setupHelper = Join-Path $profileDir "GitManager-Setup.exe"
          $required = @(
            (Join-Path $profileDir "gitmanager.exe"),
            (Join-Path $profileDir "gitmanager-service.exe"),
            (Join-Path $profileDir "crash_helper.exe"),
            (Join-Path $profileDir "gitm.exe"),
            $setupHelper,
            $installer,
            (Join-Path $staging "gitmanager.exe"),
            (Join-Path $staging "resources/gitmanager.service.exe"),
            (Join-Path $staging "resources/crash_helper.exe"),
            (Join-Path $staging "resources/gitm.exe"),
            (Join-Path $staging "resources/gitmanager-setup.exe")
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) { throw "Windows release payload is incomplete: $($missing -join ', ')" }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
            Write-Host "::notice::No production signing certificate configured. MPDEV will use the manifest's local test signing settings."
          } else {
            foreach ($target in $required) {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "tools/sign_windows_file.ps1" -FilePath $target
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target." }
            }
          }

      - name: Build required MSI and MSIX packages with Master Packager Dev
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $appRoot = (Resolve-Path "build/.rcache/windows-package/source").Path
          $manifest = "build/.rcache/windows-package/mpdev-package.json"
          if (-not (Test-Path -LiteralPath $manifest)) { throw "Generated MPDEV MSI/MSIX manifest is missing: $manifest" }
          $env:GITMANAGER_APP_SOURCE = $appRoot
          & $env:MPDEV_EXE build $manifest --working-dir "$PWD" --use-msbuild-message-format true
          if ($LASTEXITCODE -ne 0) { throw "Master Packager Dev failed to build Windows MSI/MSIX." }

          $outputDir = "build/.rcache/windows-installers"
          $msi = @(Get-ChildItem $outputDir -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          $msix = @(Get-ChildItem $outputDir -Filter "*.msix" -File -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1 -or $msix.Count -ne 1) {
            throw "Expected exactly one MPDEV MSI and one MPDEV MSIX; found MSI=$($msi.Count), MSIX=$($msix.Count)."
          }
          foreach ($package in @($msi[0], $msix[0])) {
            if ($package.Length -lt 1MB) { throw "MPDEV output is unexpectedly small: $($package.FullName)" }
            if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "tools/sign_windows_file.ps1" -FilePath $package.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($package.FullName)." }
            }
            Write-Host "Created MPDEV package: $($package.FullName)"
          }

      - name: Verify Windows signatures when production signing is configured
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_THUMBPRINT != ''
        shell: pwsh
        run: |
          $kits = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          if (-not (Test-Path $kits)) { $kits = Join-Path $env:ProgramFiles "Windows Kits\10\bin" }
          $signtool = Get-ChildItem -LiteralPath $kits -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK SignTool was not found." }
          $verify = @("build/.rcache/x86_64-pc-windows-msvc/release/bundle/nsis/GitManager-Setup.exe") + @((Get-ChildItem "build/.rcache/windows-installers" -File).FullName)
          foreach ($target in $verify) {
            & $signtool verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $target" }
          }

      - name: Remove imported signing certificate
        if: runner.os == 'Windows' && always()
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $thumbprint = ($env:WINDOWS_SIGNING_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($thumbprint) {
            Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Refresh Windows release artifacts after signing and packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profileDir = "build/.rcache/x86_64-pc-windows-msvc/release"
          $staging = "build/.rcache/windows-package/source"
          $distDir = "build/dist/windows-x64"
          New-Item -ItemType Directory -Force -Path "$distDir/installer", "$distDir/app" | Out-Null
          Copy-Item -Path "$profileDir/bundle/nsis/*" -Destination "$distDir/installer" -Recurse -Force
          Copy-Item -Path "build/.rcache/windows-installers/*.msi" -Destination "$distDir/installer" -Force
          Copy-Item -Path "build/.rcache/windows-installers/*.msix" -Destination "$distDir/installer" -Force
          Copy-Item -Path "$profileDir/gitmanager.exe" -Destination "$distDir/app" -Force
          foreach ($name in @("gitm.exe", "gitmanager-setup.exe", "crash_helper.exe", "gitmanager.service.exe", "GitManager-Setup.exe")) {
            $source = Join-Path $profileDir $name
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination "$distDir/app" -Force }
          }
          New-Item -ItemType Directory -Force -Path "$distDir/app/resources" | Out-Null
          Copy-Item -Path "$staging/resources/." -Destination "$distDir/app/resources" -Recurse -Force

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-installers-${{ matrix.platform }}
          path: build/dist/${{ matrix.output }}/
          if-no-files-found: error
          compression-level: 9

  publish-cloud-node:
    name: Publish RBE node bootstrap package
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/tags/v')) }}
    needs: cloud-node-deployment
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the verified RBE bootstrap ZIP
        uses: actions/download-artifact@v4
        with:
          name: gitmanager-cloud-node-deployment
          path: release-assets

      - name: Check stable download filename and create checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f -name 'GitManager-Cloud-Node-Setup.zip' -print)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RBE node bootstrap ZIP; found ${#archives[@]}."
            exit 1
          fi
          (cd release-assets && sha256sum GitManager-Cloud-Node-Setup.zip > GitManager-Cloud-Node-Setup.zip.sha256)

      - name: Publish the moving Cloud Node download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-node-setup-latest
          target_commitish: ${{ github.sha }}
          name: GitManager Cloud Node Setup
          body: |
            Standalone, cross-platform RBE Cloud Node deployment package for NAS devices and other computers.

            This ZIP is separate from the GitManager desktop application. It contains RBE API route files, backend and Cloud Node configuration templates, the Python bootstrap installer, licenses and deployment instructions. setup.py downloads and checksum-verifies only the matching full RBE runtime for the host machine when run. It contains no binaries, machine-specific node key or credentials.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/GitManager-Cloud-Node-Setup.zip
            release-assets/GitManager-Cloud-Node-Setup.zip.sha256

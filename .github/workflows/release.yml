name: Build GitManager — Native Installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  cloud-node-deployment:
    name: RBE node bootstrap package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js for the Next.js Engine frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the lightweight RBE bootstrap ZIP (route files and configuration templates)
        run: python build.py prepare-cloud-node

      - name: Validate bootstrap installer and regression tests
        run: |
          python -m py_compile build.py tools/cloud-node-deployment/setup.py tools/cloud-node-deployment/test_setup.py
          python -m unittest discover -s tools/cloud-node-deployment -p 'test_*.py'

      - name: Verify the bootstrap payload and current runner's RBE download
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archives = sorted(pathlib.Path("target/deployment").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one bootstrap ZIP, found {len(archives)}")
          with tempfile.TemporaryDirectory(prefix="gitmanager-rbe-bootstrap-") as temp:
              with zipfile.ZipFile(archives[0], "r") as package:
                  bad = package.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC verification failed at {bad}")
                  names = set(package.namelist())
                  required = {"setup.py", "manifest.json", "settings.json", "setting.node.cn.json", "api/health.route", "api/status.route"}
                  missing = required - names
                  if missing:
                      raise SystemExit(f"Bootstrap ZIP is missing: {sorted(missing)}")
                  binary_names = {
                      "backend", "backend.exe", "cloud_node", "cloud_node.exe",
                      "container", "container.exe", "service", "service.exe",
                  }
                  if any(name.startswith("binaries/") or name.rsplit("/", 1)[-1].lower() in binary_names for name in names):
                      raise SystemExit("Bootstrap ZIP unexpectedly contains platform binaries")
                  package.extractall(temp)
              setup = pathlib.Path(temp) / "setup.py"
              result = subprocess.run([sys.executable, str(setup), "--verify-only"], check=False)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY

      - name: Upload RBE node bootstrap ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-cloud-node-deployment
          path: target/deployment/*.zip
          if-no-files-found: error
          compression-level: 0

  build-tauri:
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/.rcache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: ubuntu-22.04-arm
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux WebKitGTK & libgit2 dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config rpm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Master Packager Dev MSI toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id MasterPackager.MasterPackagerDev --exact --silent --accept-package-agreements --accept-source-agreements
          $candidates = @(
            (Get-Command mpdev.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
            "$env:ProgramFiles\Master Packager Ltd\Master Packager Dev\mpdev.exe",
            "$env:ProgramFiles\Master Packager Dev\mpdev.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if (-not $candidates) {
            $found = Get-ChildItem -Path "$env:ProgramFiles" -Filter mpdev.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $candidates = @($found.FullName) }
          }
          if (-not $candidates) { throw "Master Packager Dev was installed by WinGet but mpdev.exe could not be located." }
          "MPDEV_EXE=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $mpdevExe = [string]$candidates[0]
          & "$mpdevExe" version
          if ($LASTEXITCODE -ne 0) { throw "Master Packager Dev CLI failed its version check: $mpdevExe" }

      - name: Import optional Windows production signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
            Write-Host "::notice::No complete Windows signing credentials are configured. The Windows package will be built unsigned."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "gitmanager-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_SIGNING_PASSWORD -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $expected = ($env:WINDOWS_SIGNING_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if (-not ($imported | Where-Object { $_.Thumbprint -eq $expected })) {
              throw "The imported PFX does not contain WINDOWS_SIGNING_THUMBPRINT."
            }
            Write-Host "::notice::Windows production signing certificate imported into the ephemeral runner."
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Dependencies & Build via Python Build Script
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          GITMANAGER_SKIP_CLOUD_NODE_BUNDLE: "1"
        run: python build.py build --install-tauri-cli

      - name: Sign and verify Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $signTargets = @("build/.rcache/windows-package/source/git-manager.exe", "build/.rcache/windows-package/source/resources/git-manager-service.exe", "build/.rcache/windows-package/source/resources/crash_helper.exe", "build/.rcache/windows-package/source/resources/gitm.exe", "build/.rcache/windows-package/source/resources/gitmanager-setup.exe")
          $verifyTargets = $signTargets
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
            Write-Host "::notice::No Windows signing certificate configured. Keeping all release files unsigned; signature verification is skipped."
          } else {
            foreach ($target in $signTargets) {
              if (Test-Path -LiteralPath $target) {
                & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "tools/sign_windows_file.ps1" -FilePath $target
                if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target." }
              }
            }

            # All app and helper executables are signed before MPDEV packages the raw app bundle.
            $kits = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            if (-not (Test-Path $kits)) { $kits = Join-Path $env:ProgramFiles "Windows Kits\10\bin" }
            $signtool = Get-ChildItem -LiteralPath $kits -Directory | Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK SignTool was not found for signature verification." }
            foreach ($target in $verifyTargets) {
              if (Test-Path $target) { & $signtool verify /pa /v $target; if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $target" } }
            }
          }

      - name: Build the additional MSI with Master Packager Dev
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appRoot = Resolve-Path "build/.rcache/windows-package/source"
          if (-not (Test-Path (Join-Path $appRoot "git-manager.exe"))) { throw "The staged GitManager executable is missing." }
          $env:GITMANAGER_APP_SOURCE = $appRoot.Path
          & $env:MPDEV_EXE build "installer/master-packager/package.json" --working-dir "$PWD" --use-msbuild-message-format true
          if ($LASTEXITCODE -ne 0) { throw "Master Packager Dev failed to build the GitManager MSI." }
          $outputs = @(Get-ChildItem "build/.rcache/windows-installers" -File -ErrorAction SilentlyContinue)
          $msi = @($outputs | Where-Object { $_.Extension -eq ".msi" })
          $msix = @($outputs | Where-Object { $_.Extension -eq ".msix" })
          if ($msi.Count -ne 1 -or $msix.Count -ne 0) {
            throw "Expected exactly one MPDEV MSI and no MSIX in the desktop installer stream; found MSI=$($msi.Count), MSIX=$($msix.Count)."
          }
          Write-Host "Created MPDEV comparison MSI: $($msi[0].FullName)"

      - name: Remove imported signing certificate
        if: runner.os == 'Windows' && always()
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $thumbprint = ($env:WINDOWS_SIGNING_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($thumbprint) {
            Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-installers-${{ matrix.platform }}
          path: |
            build/.rcache/release/bundle/**
            build/.rcache/release/gitm*
            build/.rcache/release/git-manager*.exe
            build/.rcache/release/crash_helper*.exe
            build/.rcache/release/gitmanager-setup*.exe
            build/.rcache/windows-installers/*.msi
          if-no-files-found: error
          compression-level: 9

  publish-cloud-node:
    name: Publish RBE node bootstrap package
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/tags/v')) }}
    needs: cloud-node-deployment
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the verified RBE bootstrap ZIP
        uses: actions/download-artifact@v4
        with:
          name: gitmanager-cloud-node-deployment
          path: release-assets

      - name: Check stable download filename and create checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f -name 'GitManager-Cloud-Node-Setup.zip' -print)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RBE node bootstrap ZIP; found ${#archives[@]}."
            exit 1
          fi
          (cd release-assets && sha256sum GitManager-Cloud-Node-Setup.zip > GitManager-Cloud-Node-Setup.zip.sha256)

      - name: Publish the moving Cloud Node download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-node-setup-latest
          target_commitish: ${{ github.sha }}
          name: GitManager Cloud Node Setup
          body: |
            Standalone, cross-platform RBE Cloud Node deployment package for NAS devices and other computers.

            This ZIP is separate from the GitManager desktop application. It contains RBE API route files, backend and Cloud Node configuration templates, the Python bootstrap installer, licenses and deployment instructions. setup.py downloads and checksum-verifies only the matching full RBE runtime for the host machine when run. It contains no binaries, machine-specific node key or credentials.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/GitManager-Cloud-Node-Setup.zip
            release-assets/GitManager-Cloud-Node-Setup.zip.sha256

name: Linux Runtime Launch Test

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime-launch:
    name: Build and launch GitManager on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITMANAGER_SKIP_CLOUD_NODE_BUNDLE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/.rcache
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GDK_BACKEND: x11
    steps:
      - name: Check out GitManager
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux desktop and WebKit runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfuse2 xvfb xauth dbus-x11 time

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate build-script syntax and target selectors
        run: |
          python -m py_compile build.py tools/build_targets.py
          python tools/test_build_targets.py

      - name: Build the Linux x64 app without creating installers
        run: python build.py --build='linux(x64)' --type=app --debug

      - name: Prepare a realistic local repository scan fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="build/runtime-test/scan-roots"
          mkdir -p "$ROOT"
          for index in $(seq 1 12); do
            REPO="$ROOT/repository-$index"
            mkdir -p "$REPO"
            git -C "$REPO" init -q
            git -C "$REPO" config user.name "GitManager Runtime Test"
            git -C "$REPO" config user.email "runtime-test@example.invalid"
            printf '# Runtime fixture %s\n\nGitManager scan smoke test.\n' "$index" > "$REPO/README.md"
            git -C "$REPO" add README.md
            git -C "$REPO" commit -q -m "test: seed runtime fixture"
          done

          XDG_DATA_HOME="$GITHUB_WORKSPACE/build/runtime-test/xdg-data"
          PREFS_DIR="$XDG_DATA_HOME/kastrick's_software/config/GitManager"
          mkdir -p "$PREFS_DIR"
          cat > "$PREFS_DIR/preferences.json" <<EOF
          {
            "scanRoots": ["$GITHUB_WORKSPACE/$ROOT"],
            "maxScanDepth": 4,
            "includeHiddenDirs": false,
            "indexDependencyRepositories": true,
            "showDependencyRepositories": true,
            "firstRunComplete": true,
            "archiveRoot": "$GITHUB_WORKSPACE/build/runtime-test/archives",
            "archiveLocalEnabled": false,
            "archiveRemoteEnabled": false,
            "archiveTrigger": "manual",
            "archiveQuietMs": 1500,
            "cloudNodeAddress": ""
          }
          EOF

      - name: Verify the expected executable exists
        shell: bash
        run: |
          APP="build/.rcache/x86_64-unknown-linux-gnu/debug/git-manager"
          test -x "$APP"
          file "$APP"
          ldd "$APP" | tee build/linux-runtime-ldd.txt
          if grep -q "not found" build/linux-runtime-ldd.txt; then
            echo "The Linux executable has unresolved shared-library dependencies."
            exit 1
          fi

      - name: Launch the actual Tauri UI under a virtual X display
        shell: bash
        run: |
          set +e
          APP="build/.rcache/x86_64-unknown-linux-gnu/debug/git-manager"
          mkdir -p build/runtime-test
          dbus-run-session -- xvfb-run -a \
            /usr/bin/time -v \
            timeout --signal=TERM --kill-after=10s 45s \
            env XDG_DATA_HOME="$GITHUB_WORKSPACE/build/runtime-test/xdg-data" GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            "$APP" --crash-helper-child \
            2>&1 | tee build/runtime-test/linux-launch.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 124 ]; then
            echo "GitManager remained alive for the full 45-second launch window."
          elif [ "$status" -eq 0 ]; then
            echo "GitManager exited before the launch window ended; treating this as a startup failure."
            exit 1
          else
            echo "GitManager launch failed with exit code $status."
            exit "$status"
          fi

          MAX_RSS_KB=$(awk '/Maximum resident set size/ {print $6}' build/runtime-test/linux-launch.log)
          if [ -n "$MAX_RSS_KB" ] && [ "$MAX_RSS_KB" -gt 1572864 ]; then
            echo "GitManager exceeded the 1.5 GiB startup/scan memory budget: $MAX_RSS_KB KiB"
            exit 1
          fi
          echo "Peak resident memory: $MAX_RSS_KB KiB"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitmanager-linux-runtime-diagnostics
          path: |
            build/runtime-test/
            build/linux-runtime-ldd.txt
          if-no-files-found: warn
          retention-days: 14

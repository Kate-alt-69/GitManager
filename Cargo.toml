[workspace]
members = [
    "src-tauri",
    "src-tauri/vendor/rbe/atomic-io",
    "src-tauri/vendor/rbe/storage-sync-journal",
    "src-tauri/vendor/rbe/cloud-node",
    "crates/archive-core",
    "crates/gitm-cli",
    "crates/gitmanager-setup",
]
# Plain workspace builds target GitManager; sidecars are built explicitly by build.py.
default-members = ["src-tauri"]
resolver = "2"


# Optimize native release binaries and packaged installers for size.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"
incremental = false

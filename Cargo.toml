[workspace]
members = [
    "src-tauri",
    "src-tauri/vendor/rbe/atomic-io",
    "src-tauri/vendor/rbe/storage-sync-journal",
    "src-tauri/vendor/rbe/cloud-node",
    "crates/archive-core",
    "crates/gitm-cli",
    "crates/gitmanager-setup",
]
resolver = "2"


# Optimize native release binaries and packaged installers for size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false

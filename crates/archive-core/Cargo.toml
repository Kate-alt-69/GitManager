[package]
name = "gitmanager-archive"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GitManager repository snapshot, archive and recovery engine"

[dependencies]
cloud-node = { path = "../../src-tauri/vendor/rbe/cloud-node" }
git2 = { version = "0.20.4", default-features = false, features = ["https", "ssh"] }
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
atomic-io = { path = "../../src-tauri/vendor/rbe/atomic-io" }
fs2 = "0.4"
tokio = { version = "1", default-features = false, features = ["rt"] }
url = "2"

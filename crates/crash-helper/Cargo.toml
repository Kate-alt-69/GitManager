[package]
name = "crash-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform GitManager UI supervisor and background-service control"

[lib]
name = "crash_helper"
path = "src/lib.rs"

[[bin]]
name = "crash_helper"
path = "src/main.rs"

[features]
default = []
core-service = ["dep:gitmanager-core"]
account-storage = ["core-service"]
repository-data = ["core-service"]
notification-storage = ["core-service"]
preferences-storage = ["core-service"]
archive-operations = ["repository-data", "dep:gitmanager-archive"]
account-provider = ["account-storage", "dep:reqwest", "dep:tokio"]
provider-sync = ["repository-data", "account-storage", "dep:reqwest", "dep:tokio"]

[dependencies]
gitmanager-core = { path = "../gitmanager-core", optional = true }
gitmanager-archive = { path = "../archive-core", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1.40", default-features = false, features = ["rt", "net", "time"], optional = true }
dirs = "5.0"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"], optional = true }

[package]
name = "crash-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform GitManager UI supervisor and background-service control"

[lib]
name = "crash_helper"
path = "src/lib.rs"

[[bin]]
name = "crash_helper"
path = "src/main.rs"

[dependencies]
dirs = "5.0"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }

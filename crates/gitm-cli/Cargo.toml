[package]
name = "gitm-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native GitManager repository archive and recovery CLI"

[[bin]]
name = "gitm"
path = "src/main.rs"

[dependencies]
walkdir = "2"
url = "2"
git2 = { version = "0.20.4", default-features = false, features = ["https", "ssh"] }
unicode-width = "0.2"
gitmanager-archive = { path = "../archive-core" }
crossterm = "0.28"

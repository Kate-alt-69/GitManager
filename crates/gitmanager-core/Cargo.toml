[package]
name = "gitmanager-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared native Git repository discovery, metadata and indexing core"

[features]
default = []
scan-engine = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
fs2 = "0.4"
git2 = { version = "0.20.4", default-features = false, features = ["https", "ssh"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
gitmanager-archive = { path = "../archive-core" }

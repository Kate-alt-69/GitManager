[package]
name = "gitmanager-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared native Git repository discovery, metadata and indexing core"

[features]
default = []
git-engine = ["dep:chrono", "dep:git2", "dep:walkdir"]
scan-engine = ["git-engine"]

[dependencies]
chrono = { version = "0.4", features = ["serde"], optional = true }
dirs = "5.0"
fs2 = "0.4"
git2 = { version = "0.20.4", default-features = false, features = ["https", "ssh"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = { version = "2.5", optional = true }

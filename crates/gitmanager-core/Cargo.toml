[package]
name = "gitmanager-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared native Git repository discovery, metadata and indexing core"

[features]
default = []
scan-engine = ["dep:fs2"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
fs2 = { version = "0.4", optional = true }
git2 = { version = "0.20.4", default-features = false, features = ["https", "ssh"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gitmanager-archive = { path = "../archive-core" }

app-id: com.gitmanager.desktop
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: git-manager
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=ssh-auth
  - --filesystem=home
  - --filesystem=~/.local/bin:create
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
modules:
  - name: gitmanager
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib /app/share
      - cp -a bin/. /app/bin/
      - if [ -d lib ]; then cp -a lib/. /app/lib/; fi
      - if [ -d share ]; then cp -a share/. /app/share/; fi
    sources:
      - type: dir
        path: ../../build/.rcache/flatpak/staging

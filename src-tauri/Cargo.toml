[package]
name = "git-manager"
version = "1.0.0"
description = "Cross-platform Pure-Rust Native Git Repository Manager, Git Tree Visualizer & Background Update Service built with Rust and Tauri v2 (Windows 10/11, Linux, macOS)"
authors = ["Kastrick"]
license = "Apache-2.0"
repository = "https://github.com/gitmanager/git-manager"
edition = "2021"
default-run = "gitmanager"

[lib]
name = "git_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gitmanager"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
url = "2.5"
tauri = { version = "2.1.0", default-features = false, features = ["wry", "compression", "x11"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "=0.37.1", default-features = false, features = ["system"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
dirs = "5.0"
crash-helper = { path = "../crates/crash-helper", features = ["async-ipc"] }
gitmanager-core = { path = "../crates/gitmanager-core" }
fs2 = "0.4"

[package]
name = "git-manager"
version = "1.0.0"
description = "Cross-platform Pure-Rust Native Git Repository Manager, Git Tree Visualizer & Background Update Service built with Rust and Tauri v2 (Windows 10/11, Linux, macOS)"
authors = ["GitManager Contributors"]
license = "MIT"
repository = "https://github.com/gitmanager/git-manager"
edition = "2021"
default-run = "git-manager"

[lib]
name = "git_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "git-manager"
path = "src/main.rs"

[[bin]]
name = "git-manager-service"
path = "src/bin/git_manager_service.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = { version = "0.19", default-features = false, features = ["https", "ssh"] }
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

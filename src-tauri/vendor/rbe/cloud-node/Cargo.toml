[package]
name = "cloud-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vendored RBE Cloud Node content-addressed storage and provider synchronization core"

[lib]
name = "cloud_node"
path = "src/lib.rs"

[features]
default = ["client"]
client = ["dep:reqwest", "dep:tokio-util"]

[dependencies]
atomic-io = { path = "../atomic-io" }
storage-sync-journal = { path = "../storage-sync-journal" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
ed25519-dalek = "2"
rand = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
url = "2"

# GitManager vendor adaptation (2026-11-13): standalone manifest replaces RBE workspace-inherited fields.
[package]
name = "cloud-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Vendored RBE Cloud Node content-addressed storage and provider synchronization core"

[lib]
name = "cloud_node"
path = "src/lib.rs"

[features]
# Keep the core storage types lightweight. Consumers opt into the transport they use.
default = []
# Backwards-compatible umbrella feature for all Cloud Node client capabilities.
client = ["peer-client", "provider-sync"]
# Authenticated RBE node-to-node transport.
peer-client = ["dep:reqwest", "dep:tokio-util", "peer-auth", "recovery"]
peer-auth = ["dep:ed25519-dalek"]
# Object-provider synchronization used by GitManager's repository archives.
provider-sync = ["dep:reqwest", "dep:tokio-util", "recovery"]
# Shared recovery receiver used by provider sync and peer/server transfers.
recovery = []
# Inbound RBE server; kept separate from GitManager's desktop archive client.
server = ["peer-auth", "recovery"]
local-sync = []
registry-ingest = ["provider-sync"]
journal-ingest = ["dep:storage-sync-journal"]
[dependencies]
atomic-io = { path = "../atomic-io" }
storage-sync-journal = { path = "../storage-sync-journal", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
ed25519-dalek = { version = "2", optional = true }
rand = "0.8"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
